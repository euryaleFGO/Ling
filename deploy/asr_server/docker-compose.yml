version: '3.8'

services:
  asr-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asr-server
    ports:
      - "5002:5002"
    volumes:
      # Model cache (avoid re-download)
      - asr-models:/root/.cache/modelscope
      # Logs
      - ./logs:/app/logs
    environment:
      - ASR_DEVICE=auto
      - ASR_HOST=0.0.0.0
      - ASR_PORT=5002
      - CUDA_VISIBLE_DEVICES=0
    # GPU support (requires nvidia-docker)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  asr-models:
